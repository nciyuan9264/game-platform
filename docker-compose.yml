x-build-args: &build-args
  GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
  HTTP_PROXY: ${HTTP_PROXY:-http://sys-proxy-rd-relay.byted.org:8118}
  HTTPS_PROXY: ${HTTPS_PROXY:-http://sys-proxy-rd-relay.byted.org:8118}
  http_proxy: ${http_proxy:-http://sys-proxy-rd-relay.byted.org:8118}
  https_proxy: ${https_proxy:-http://sys-proxy-rd-relay.byted.org:8118}

x-runtime-env: &runtime-env
  PAM_ENV: ${PAM_ENV:-local}
  PAM_SERVICE_REGISTRY_PREFIX: ${PAM_SERVICE_REGISTRY_PREFIX:-pam/services}
  POSTGRES_DSN: ${POSTGRES_DSN:?set Game Platform PostgreSQL DSN}
  REDIS_ADDR: ${REDIS_ADDR:-global-redis:6379}
  REDIS_PASSWORD: ""
  REDIS_DB: ${GAME_REDIS_DB:-0}
  ETCD_ENDPOINTS: ${ETCD_ENDPOINTS:-global-etcd:2379}
  ETCD_USERNAME: ${ETCD_USERNAME:-}
  ETCD_PASSWORD: ${ETCD_PASSWORD:-}
  NATS_URL: ${NATS_URL:-nats://global-nats:4222}
  SERVICE_VERSION: ${SERVICE_VERSION:-dev}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://global-otel-collector:4317}
  OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

services:
  schema-migrate:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        <<: *build-args
        SERVICE: migrate-schema
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:?set Game Platform PostgreSQL DSN}
    networks:
      - global-network
    restart: "no"

  control-plane:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        <<: *build-args
        SERVICE: control-plane
    environment:
      <<: *runtime-env
      SERVER_ADDR: ":8080"
      CONTROL_RPC_ADDR: ":18091"
      CONTROL_RPC_PSM: game.platform.control
      NODE_ID: control-plane-1
      PUBLIC_ADDR: control-plane:8080
      KITEX_IP_TO_REGISTRY: control-plane
      KITEX_PORT_TO_REGISTRY: "18091"
      AUTH_RPC_ADDR: ${AUTH_RPC_ADDR:-auth-backend:19090}
      AUTH_RPC_PSM: ${AUTH_RPC_PSM:-pam.auth.rpc}
    ports:
      - "127.0.0.1:18080:8080"
    expose:
      - "18091"
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    networks:
      global-network:
        aliases:
          - control-plane
    restart: unless-stopped

  platform-rpc:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        <<: *build-args
        SERVICE: platform-rpc
    environment:
      <<: *runtime-env
      GAME_PLATFORM_RPC_ADDR: ":18092"
      GAME_PLATFORM_HEALTH_ADDR: ":18093"
      GAME_PLATFORM_RPC_PSM: game.platform.rpc
      KITEX_IP_TO_REGISTRY: platform-rpc
      KITEX_PORT_TO_REGISTRY: "18092"
      CONTROL_RPC_ADDR: control-plane:18091
      CONTROL_RPC_PSM: game.platform.control
    ports:
      - "127.0.0.1:18092:18092"
      - "127.0.0.1:18093:18093"
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
      control-plane:
        condition: service_started
    networks:
      global-network:
        aliases:
          - game-platform-rpc
    restart: unless-stopped

  platform-api-1:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        <<: *build-args
        SERVICE: platform-api
    environment:
      <<: *runtime-env
      SERVER_ADDR: ":8080"
      AUTH_RPC_ADDR: ${AUTH_RPC_ADDR:-auth-backend:19090}
      AUTH_RPC_PSM: ${AUTH_RPC_PSM:-pam.auth.rpc}
      CONTROL_RPC_ADDR: control-plane:18091
      CONTROL_RPC_PSM: game.platform.control
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_DEV_CODE_RESPONSE: ${AUTH_DEV_CODE_RESPONSE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:18010,http://localhost:18020,http://localhost:18031,http://localhost:18032}
      ACQUIRE_LOADTEST_ENABLED: ${ACQUIRE_LOADTEST_ENABLED:-false}
      ACQUIRE_LOADTEST_TOKEN: ${ACQUIRE_LOADTEST_TOKEN:-}
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
      control-plane:
        condition: service_started
    networks:
      - global-network
    restart: unless-stopped

  platform-api-lb:
    image: nginx:1.27-alpine
    volumes:
      - ./deployments/nginx-platform-api.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      - platform-api-1
    networks:
      global-network:
        aliases:
          - platform-api
    restart: unless-stopped

  gateway-1:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        <<: *build-args
        SERVICE: gateway
    environment:
      <<: *runtime-env
      SERVER_ADDR: ":8080"
      NODE_ID: gateway-1
      PUBLIC_ADDR: gateway-1:8080
      AUTH_RPC_ADDR: ${AUTH_RPC_ADDR:-auth-backend:19090}
      AUTH_RPC_PSM: ${AUTH_RPC_PSM:-pam.auth.rpc}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:18010,http://localhost:18032}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    networks:
      global-network:
        aliases:
          - gateway
    restart: unless-stopped

  gateway-lb:
    image: nginx:1.27-alpine
    volumes:
      - ./deployments/nginx-gateway.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:18000:8080"
    depends_on:
      - gateway-1
    networks:
      global-network:
        aliases:
          - game-platform-gateway
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deployments/frontend.Dockerfile
    ports:
      - "127.0.0.1:18010:8080"
    depends_on:
      - platform-api-lb
      - control-plane
      - gateway-1
    networks:
      - global-network
    restart: unless-stopped

  admin-console:
    build:
      context: ../game-platform-admin
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18020:8080"
    depends_on:
      - platform-api-lb
      - control-plane
    networks:
      - global-network
    restart: unless-stopped

  auth-frontend:
    build:
      context: ../game-platform-auth-frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: https://bnpm.byted.org
        VITE_DEFAULT_REDIRECT: http://localhost:18032/game/davinci
    ports:
      - "127.0.0.1:18031:8080"
    depends_on:
      - platform-api-lb
    networks:
      - global-network
    restart: unless-stopped

  game-frontend:
    build:
      context: ../game-platform-game-frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: https://bnpm.byted.org
        VITE_AUTH_ORIGIN: http://localhost:18031
    ports:
      - "127.0.0.1:18032:8080"
    depends_on:
      - platform-api-lb
      - control-plane
      - gateway-lb
    networks:
      - global-network
    restart: unless-stopped

  roomhost-1:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        <<: *build-args
        SERVICE: roomhost
    environment:
      <<: *runtime-env
      NODE_ID: roomhost-1
      PUBLIC_ADDR: roomhost-1:9000
    stop_grace_period: 15s
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    networks:
      - global-network
    restart: unless-stopped

  smoke-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        <<: *build-args
        SERVICE: smoke-test
    environment:
      AUTH_URL: http://platform-api:8080
      CONTROL_URL: http://platform-api:8080
      GW_LB_WS: ws://gateway-lb:8080/ws
    depends_on:
      - platform-api-lb
      - control-plane
      - gateway-lb
      - gateway-1
      - roomhost-1
    networks:
      - global-network

networks:
  global-network:
    external: true
