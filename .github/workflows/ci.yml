name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout game platform
        uses: actions/checkout@v4
        with:
          path: game-platform
          fetch-depth: 0

      - name: Checkout pinned IDL
        uses: actions/checkout@v4
        with:
          repository: nciyuan9264/pam-idl
          ref: 74f63acb1a0fc24f26ba235475327fb0020f0984
          path: pam-idl

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.4
          cache-dependency-path: game-platform/go.sum

      - name: Validate IDL
        working-directory: pam-idl
        run: |
          node --test scripts/validator.test.js
          node scripts/validate.js

      - name: Verify generated internal RPC code
        working-directory: game-platform
        run: |
          go install github.com/cloudwego/kitex/tool/cmd/kitex@v0.16.3
          PAM_IDL_ROOT="$GITHUB_WORKSPACE/pam-idl" \
            KITEX_BIN="$(go env GOPATH)/bin/kitex" \
            ./scripts/generate-rpc.sh
          git diff --exit-code -- kitex_gen

      - name: Go quality gates
        working-directory: game-platform
        run: |
          test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          go vet ./...
          go test ./...

      - name: Validate release classification
        working-directory: game-platform
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ./scripts/deploy-game-slot-test.sh
          ./scripts/changed-release-components-test.sh
          ./scripts/validate-engine-version-bump-test.sh
          ./scripts/validate-center-imports.sh
          base="${EVENT_BASE_SHA}"
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          ./scripts/changed-release-components.sh "${base}" HEAD | jq .
          ./scripts/validate-engine-version-bump.sh "${base}" HEAD

      - name: Build service binaries
        working-directory: game-platform
        run: |
          services=(
            platform-rpc
            control-plane
            gateway
            roomhost-acquire
            roomhost-davinci
            roomhost-splendor
            roomhost-yinsh
            roomhost-othello
            roomhost-fugitive
            roomhost-warchest
            roomhost-quoridor
            roomhost-hex
            roomhost-loveletter
            roomhost-sixnimmt
            roomhost-forsale
            migrate-schema
            backfill-replay
            game-release
          )
          pids=()
          for service in "${services[@]}"; do
            go build -o "/tmp/${service}" "./cmd/${service}" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done

      - name: Validate Compose configurations
        working-directory: game-platform
        env:
          POSTGRES_DSN: postgresql://ci:ci@ci.pg.rds.aliyuncs.com:5432/gamebus_prod?sslmode=require
          WS_ALLOWED_ORIGINS: https://board.example.com
          ACQUIRE_ROOMHOST_A_IMAGE: registry.example.com/game-platform-roomhost-acquire:ci-a
          ACQUIRE_ROOMHOST_B_IMAGE: registry.example.com/game-platform-roomhost-acquire:ci-b
          ACQUIRE_ROOMHOST_A_VERSION: ci-a
          ACQUIRE_ROOMHOST_B_VERSION: ci-b
          DAVINCI_ROOMHOST_A_IMAGE: registry.example.com/game-platform-roomhost-davinci:ci-a
          DAVINCI_ROOMHOST_B_IMAGE: registry.example.com/game-platform-roomhost-davinci:ci-b
          DAVINCI_ROOMHOST_A_VERSION: ci-a
          DAVINCI_ROOMHOST_B_VERSION: ci-b
          SPLENDOR_ROOMHOST_A_IMAGE: registry.example.com/game-platform-roomhost-splendor:ci-a
          SPLENDOR_ROOMHOST_B_IMAGE: registry.example.com/game-platform-roomhost-splendor:ci-b
          SPLENDOR_ROOMHOST_A_VERSION: ci-a
          SPLENDOR_ROOMHOST_B_VERSION: ci-b
          YINSH_ROOMHOST_A_IMAGE: registry.example.com/game-platform-roomhost-yinsh:ci-a
          YINSH_ROOMHOST_B_IMAGE: registry.example.com/game-platform-roomhost-yinsh:ci-b
          YINSH_ROOMHOST_A_VERSION: ci-a
          YINSH_ROOMHOST_B_VERSION: ci-b
          OTHELLO_ROOMHOST_A_IMAGE: registry.example.com/game-platform-roomhost-othello:ci-a
          OTHELLO_ROOMHOST_B_IMAGE: registry.example.com/game-platform-roomhost-othello:ci-b
          OTHELLO_ROOMHOST_A_VERSION: ci-a
          OTHELLO_ROOMHOST_B_VERSION: ci-b
          FUGITIVE_ROOMHOST_A_IMAGE: registry.example.com/game-platform-roomhost-fugitive:ci-a
          FUGITIVE_ROOMHOST_B_IMAGE: registry.example.com/game-platform-roomhost-fugitive:ci-b
          FUGITIVE_ROOMHOST_A_VERSION: ci-a
          FUGITIVE_ROOMHOST_B_VERSION: ci-b
          WARCHEST_ROOMHOST_A_IMAGE: registry.example.com/game-platform-roomhost-warchest:ci-a
          WARCHEST_ROOMHOST_B_IMAGE: registry.example.com/game-platform-roomhost-warchest:ci-b
          WARCHEST_ROOMHOST_A_VERSION: ci-a
          WARCHEST_ROOMHOST_B_VERSION: ci-b
          QUORIDOR_ROOMHOST_A_IMAGE: registry.example.com/game-platform-roomhost-quoridor:ci-a
          QUORIDOR_ROOMHOST_B_IMAGE: registry.example.com/game-platform-roomhost-quoridor:ci-b
          QUORIDOR_ROOMHOST_A_VERSION: ci-a
          QUORIDOR_ROOMHOST_B_VERSION: ci-b
          HEX_ROOMHOST_A_IMAGE: registry.example.com/game-platform-roomhost-hex:ci-a
          HEX_ROOMHOST_B_IMAGE: registry.example.com/game-platform-roomhost-hex:ci-b
          HEX_ROOMHOST_A_VERSION: ci-a
          HEX_ROOMHOST_B_VERSION: ci-b
          LOVELETTER_ROOMHOST_A_IMAGE: registry.example.com/game-platform-roomhost-loveletter:ci-a
          LOVELETTER_ROOMHOST_B_IMAGE: registry.example.com/game-platform-roomhost-loveletter:ci-b
          LOVELETTER_ROOMHOST_A_VERSION: ci-a
          LOVELETTER_ROOMHOST_B_VERSION: ci-b
          SIXNIMMT_ROOMHOST_A_IMAGE: registry.example.com/game-platform-roomhost-sixnimmt:ci-a
          SIXNIMMT_ROOMHOST_B_IMAGE: registry.example.com/game-platform-roomhost-sixnimmt:ci-b
          SIXNIMMT_ROOMHOST_A_VERSION: ci-a
          SIXNIMMT_ROOMHOST_B_VERSION: ci-b
          FORSALE_ROOMHOST_A_IMAGE: registry.example.com/game-platform-roomhost-forsale:ci-a
          FORSALE_ROOMHOST_B_IMAGE: registry.example.com/game-platform-roomhost-forsale:ci-b
          FORSALE_ROOMHOST_A_VERSION: ci-a
          FORSALE_ROOMHOST_B_VERSION: ci-b
        run: |
          ./scripts/validate-prod-config.sh
