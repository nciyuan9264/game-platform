name: Deploy

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component override
        type: choice
        required: true
        default: auto
        options:
          - auto
          - center
          - acquire
          - davinci
          - splendor
          - yinsh
          - othello
      compatibility_ack:
        description: Reason an engine implementation change is version-compatible
        type: string
        required: false
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      center: ${{ steps.matrix.outputs.center }}
      games: ${{ steps.matrix.outputs.games }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release matrix
        id: matrix
        env:
          EVENT_BASE_SHA: ${{ github.event.before }}
          COMPONENT_OVERRIDE: ${{ inputs.component || 'auto' }}
          COMPATIBILITY_ACK: ${{ inputs.compatibility_ack }}
        run: |
          base="${EVENT_BASE_SHA}"
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          matrix="$(./scripts/changed-release-components.sh "${base}" HEAD)"
          center="$(jq -c '.center' <<<"${matrix}")"
          games="$(jq -c '.games' <<<"${matrix}")"
          case "${COMPONENT_OVERRIDE}" in
            center)
              center='["control-plane","gateway","migrate-schema","platform-rpc"]'
              games='[]'
              ;;
            acquire|davinci|splendor|yinsh|othello)
              center='[]'
              games="$(jq -cn --arg game "${COMPONENT_OVERRIDE}" '[$game]')"
              ;;
          esac
          if [ -n "${COMPATIBILITY_ACK}" ]; then
            ./scripts/validate-engine-version-bump.sh \
              "${base}" HEAD \
              --compatibility-ack "${COMPATIBILITY_ACK}"
          else
            ./scripts/validate-engine-version-bump.sh "${base}" HEAD
          fi
          echo "center=${center}" >>"${GITHUB_OUTPUT}"
          echo "games=${games}" >>"${GITHUB_OUTPUT}"
          jq -cn --argjson center "${center}" --argjson games "${games}" \
            '{center: $center, games: $games}'

  build-center:
    needs: detect
    if: needs.detect.outputs.center != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.center) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_LOGIN_SERVER }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Build immutable center image
        env:
          REGISTRY: ${{ secrets.TCR_LOGIN_SERVER }}
          SERVICE: ${{ matrix.service }}
        run: |
          image="${REGISTRY}/tengxuntcr/game-platform-${SERVICE}:${GITHUB_SHA}"
          docker build \
            --build-arg SERVICE="${SERVICE}" \
            -f deployments/Dockerfile \
            -t "${image}" \
            .
          docker push "${image}"

  build-games:
    needs: detect
    if: needs.detect.outputs.games != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.detect.outputs.games) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_LOGIN_SERVER }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Build immutable game RoomHost image
        env:
          REGISTRY: ${{ secrets.TCR_LOGIN_SERVER }}
          GAME: ${{ matrix.game }}
        run: |
          service="roomhost-${GAME}"
          image="${REGISTRY}/tengxuntcr/game-platform-${service}:${GITHUB_SHA}"
          docker build \
            --build-arg SERVICE="${service}" \
            -f deployments/Dockerfile \
            -t "${image}" \
            .
          docker push "${image}"

  build-release-tool:
    needs: detect
    if: needs.detect.outputs.games != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_LOGIN_SERVER }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Build game release tool
        env:
          REGISTRY: ${{ secrets.TCR_LOGIN_SERVER }}
        run: |
          image="${REGISTRY}/tengxuntcr/game-platform-game-release:${GITHUB_SHA}"
          docker build \
            --build-arg SERVICE=game-release \
            -f deployments/Dockerfile \
            -t "${image}" \
            .
          docker push "${image}"

  deploy-center:
    needs:
      - detect
      - build-center
    if: >-
      always() &&
      needs.detect.outputs.center != '[]' &&
      needs.build-center.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Upload production configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml,scripts/validate-prod-config.sh
          target: /home/game-platform
      - name: Roll out changed center services
        uses: appleboy/ssh-action@v1.2.0
        env:
          TCR_LOGIN_SERVER: ${{ secrets.TCR_LOGIN_SERVER }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
          CENTER_SERVICES: ${{ needs.detect.outputs.center }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TCR_LOGIN_SERVER,TCR_USERNAME,TCR_PASSWORD,IMAGE_TAG,CENTER_SERVICES
          script: |
            set -eu
            cd /home/game-platform
            test -f .env
            set -a
            . ./.env
            set +a
            registry="${TCR_LOGIN_SERVER}/tengxuntcr"
            export GAME_PLATFORM_IMAGE_REGISTRY="${registry}"
            export GAME_PLATFORM_IMAGE_TAG="${IMAGE_TAG}"
            export ACQUIRE_ROOMHOST_A_IMAGE="${ACQUIRE_ROOMHOST_A_IMAGE:-${registry}/game-platform-roomhost-acquire:${IMAGE_TAG}}"
            export ACQUIRE_ROOMHOST_B_IMAGE="${ACQUIRE_ROOMHOST_B_IMAGE:-${registry}/game-platform-roomhost-acquire:${IMAGE_TAG}}"
            export ACQUIRE_ROOMHOST_A_VERSION="${ACQUIRE_ROOMHOST_A_VERSION:-${IMAGE_TAG}}"
            export ACQUIRE_ROOMHOST_B_VERSION="${ACQUIRE_ROOMHOST_B_VERSION:-${IMAGE_TAG}}"
            export DAVINCI_ROOMHOST_A_IMAGE="${DAVINCI_ROOMHOST_A_IMAGE:-${registry}/game-platform-roomhost-davinci:${IMAGE_TAG}}"
            export DAVINCI_ROOMHOST_B_IMAGE="${DAVINCI_ROOMHOST_B_IMAGE:-${registry}/game-platform-roomhost-davinci:${IMAGE_TAG}}"
            export DAVINCI_ROOMHOST_A_VERSION="${DAVINCI_ROOMHOST_A_VERSION:-${IMAGE_TAG}}"
            export DAVINCI_ROOMHOST_B_VERSION="${DAVINCI_ROOMHOST_B_VERSION:-${IMAGE_TAG}}"
            export SPLENDOR_ROOMHOST_A_IMAGE="${SPLENDOR_ROOMHOST_A_IMAGE:-${registry}/game-platform-roomhost-splendor:${IMAGE_TAG}}"
            export SPLENDOR_ROOMHOST_B_IMAGE="${SPLENDOR_ROOMHOST_B_IMAGE:-${registry}/game-platform-roomhost-splendor:${IMAGE_TAG}}"
            export SPLENDOR_ROOMHOST_A_VERSION="${SPLENDOR_ROOMHOST_A_VERSION:-${IMAGE_TAG}}"
            export SPLENDOR_ROOMHOST_B_VERSION="${SPLENDOR_ROOMHOST_B_VERSION:-${IMAGE_TAG}}"
            export YINSH_ROOMHOST_A_IMAGE="${YINSH_ROOMHOST_A_IMAGE:-${registry}/game-platform-roomhost-yinsh:${IMAGE_TAG}}"
            export YINSH_ROOMHOST_B_IMAGE="${YINSH_ROOMHOST_B_IMAGE:-${registry}/game-platform-roomhost-yinsh:${IMAGE_TAG}}"
            export YINSH_ROOMHOST_A_VERSION="${YINSH_ROOMHOST_A_VERSION:-${IMAGE_TAG}}"
            export YINSH_ROOMHOST_B_VERSION="${YINSH_ROOMHOST_B_VERSION:-${IMAGE_TAG}}"
            export OTHELLO_ROOMHOST_A_IMAGE="${OTHELLO_ROOMHOST_A_IMAGE:-${registry}/game-platform-roomhost-othello:${IMAGE_TAG}}"
            export OTHELLO_ROOMHOST_B_IMAGE="${OTHELLO_ROOMHOST_B_IMAGE:-${registry}/game-platform-roomhost-othello:${IMAGE_TAG}}"
            export OTHELLO_ROOMHOST_A_VERSION="${OTHELLO_ROOMHOST_A_VERSION:-${IMAGE_TAG}}"
            export OTHELLO_ROOMHOST_B_VERSION="${OTHELLO_ROOMHOST_B_VERSION:-${IMAGE_TAG}}"
            printf '%s' "${TCR_PASSWORD}" | docker login "${TCR_LOGIN_SERVER}" \
              --username "${TCR_USERNAME}" --password-stdin
            chmod +x scripts/validate-prod-config.sh
            ./scripts/validate-prod-config.sh
            services="$(printf '%s' "${CENTER_SERVICES}" | jq -r '.[]')"
            compose_services="$(
              printf '%s\n' "${services}" |
                sed 's/^migrate-schema$/schema-migrate/' |
                tr '\n' ' '
            )"
            docker compose -f docker-compose.prod.yml pull ${compose_services}
            if printf '%s\n' "${services}" | grep -Fxq migrate-schema; then
              docker compose -f docker-compose.prod.yml run --rm --no-deps schema-migrate
            fi
            runtime_services="$(
              printf '%s\n' "${services}" |
                grep -v '^migrate-schema$' |
                tr '\n' ' '
            )"
            if [ -n "${runtime_services}" ]; then
              docker compose -f docker-compose.prod.yml \
                up -d --no-deps ${runtime_services}
            fi
            if printf '%s\n' "${services}" | grep -Fxq platform-rpc; then
              for attempt in $(seq 1 30); do
                curl --fail --silent http://127.0.0.1:18093/readyz >/dev/null && break
                test "${attempt}" -lt 30
                sleep 2
              done
            fi

  deploy-games:
    needs:
      - detect
      - build-games
      - build-release-tool
      - deploy-center
    if: >-
      always() &&
      needs.detect.outputs.games != '[]' &&
      needs.build-games.result == 'success' &&
      needs.build-release-tool.result == 'success' &&
      (needs.deploy-center.result == 'success' || needs.deploy-center.result == 'skipped')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        game: ${{ fromJSON(needs.detect.outputs.games) }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload game release scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml,scripts/deploy-game-slot.sh,scripts/validate-prod-config.sh
          target: /home/game-platform
      - name: Deploy game slot
        uses: appleboy/ssh-action@v1.2.0
        env:
          TCR_LOGIN_SERVER: ${{ secrets.TCR_LOGIN_SERVER }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
          GAME: ${{ matrix.game }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: TCR_LOGIN_SERVER,TCR_USERNAME,TCR_PASSWORD,IMAGE_TAG,GAME
          script: |
            set -eu
            cd /home/game-platform
            set -a
            . ./.env
            set +a
            registry="${TCR_LOGIN_SERVER}/tengxuntcr"
            export ACQUIRE_ROOMHOST_A_IMAGE="${ACQUIRE_ROOMHOST_A_IMAGE:-${registry}/game-platform-roomhost-acquire:${IMAGE_TAG}}"
            export ACQUIRE_ROOMHOST_B_IMAGE="${ACQUIRE_ROOMHOST_B_IMAGE:-${registry}/game-platform-roomhost-acquire:${IMAGE_TAG}}"
            export ACQUIRE_ROOMHOST_A_VERSION="${ACQUIRE_ROOMHOST_A_VERSION:-${IMAGE_TAG}}"
            export ACQUIRE_ROOMHOST_B_VERSION="${ACQUIRE_ROOMHOST_B_VERSION:-${IMAGE_TAG}}"
            export DAVINCI_ROOMHOST_A_IMAGE="${DAVINCI_ROOMHOST_A_IMAGE:-${registry}/game-platform-roomhost-davinci:${IMAGE_TAG}}"
            export DAVINCI_ROOMHOST_B_IMAGE="${DAVINCI_ROOMHOST_B_IMAGE:-${registry}/game-platform-roomhost-davinci:${IMAGE_TAG}}"
            export DAVINCI_ROOMHOST_A_VERSION="${DAVINCI_ROOMHOST_A_VERSION:-${IMAGE_TAG}}"
            export DAVINCI_ROOMHOST_B_VERSION="${DAVINCI_ROOMHOST_B_VERSION:-${IMAGE_TAG}}"
            export SPLENDOR_ROOMHOST_A_IMAGE="${SPLENDOR_ROOMHOST_A_IMAGE:-${registry}/game-platform-roomhost-splendor:${IMAGE_TAG}}"
            export SPLENDOR_ROOMHOST_B_IMAGE="${SPLENDOR_ROOMHOST_B_IMAGE:-${registry}/game-platform-roomhost-splendor:${IMAGE_TAG}}"
            export SPLENDOR_ROOMHOST_A_VERSION="${SPLENDOR_ROOMHOST_A_VERSION:-${IMAGE_TAG}}"
            export SPLENDOR_ROOMHOST_B_VERSION="${SPLENDOR_ROOMHOST_B_VERSION:-${IMAGE_TAG}}"
            export YINSH_ROOMHOST_A_IMAGE="${YINSH_ROOMHOST_A_IMAGE:-${registry}/game-platform-roomhost-yinsh:${IMAGE_TAG}}"
            export YINSH_ROOMHOST_B_IMAGE="${YINSH_ROOMHOST_B_IMAGE:-${registry}/game-platform-roomhost-yinsh:${IMAGE_TAG}}"
            export YINSH_ROOMHOST_A_VERSION="${YINSH_ROOMHOST_A_VERSION:-${IMAGE_TAG}}"
            export YINSH_ROOMHOST_B_VERSION="${YINSH_ROOMHOST_B_VERSION:-${IMAGE_TAG}}"
            export OTHELLO_ROOMHOST_A_IMAGE="${OTHELLO_ROOMHOST_A_IMAGE:-${registry}/game-platform-roomhost-othello:${IMAGE_TAG}}"
            export OTHELLO_ROOMHOST_B_IMAGE="${OTHELLO_ROOMHOST_B_IMAGE:-${registry}/game-platform-roomhost-othello:${IMAGE_TAG}}"
            export OTHELLO_ROOMHOST_A_VERSION="${OTHELLO_ROOMHOST_A_VERSION:-${IMAGE_TAG}}"
            export OTHELLO_ROOMHOST_B_VERSION="${OTHELLO_ROOMHOST_B_VERSION:-${IMAGE_TAG}}"
            printf '%s' "${TCR_PASSWORD}" | docker login "${TCR_LOGIN_SERVER}" \
              --username "${TCR_USERNAME}" --password-stdin
            chmod +x scripts/deploy-game-slot.sh scripts/validate-prod-config.sh
            ./scripts/validate-prod-config.sh
            export GAME_RELEASE_IMAGE="${registry}/game-platform-game-release:${IMAGE_TAG}"
            target_image="${registry}/game-platform-roomhost-${GAME}:${IMAGE_TAG}"
            docker pull "${GAME_RELEASE_IMAGE}"
            docker pull "${target_image}"
            ./scripts/deploy-game-slot.sh "${GAME}" "${target_image}"

  notify:
    needs:
      - deploy-center
      - deploy-games
    if: >-
      always() &&
      (needs.deploy-center.result == 'success' || needs.deploy-center.result == 'skipped') &&
      (needs.deploy-games.result == 'success' || needs.deploy-games.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Feishu
        continue-on-error: true
        run: |
          curl --fail-with-body -X POST \
            "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"msg_type":"text","content":{"text":"game-platform deployment succeeded"}}'
