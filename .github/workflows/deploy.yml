name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - migrate-schema
          - platform-rpc
          - control-plane
          - gateway
          - roomhost
          - migrate-game-history
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Tencent Cloud TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_LOGIN_SERVER }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push image
        env:
          REGISTRY: ${{ secrets.TCR_LOGIN_SERVER }}
          SERVICE: ${{ matrix.service }}
        run: |
          tag="${GITHUB_SHA::7}"
          image="${REGISTRY}/tengxuntcr/game-platform-${SERVICE}"
          docker build \
            --build-arg SERVICE="${SERVICE}" \
            -f deployments/Dockerfile \
            -t "${image}:${tag}" \
            -t "${image}:latest" \
            .
          docker push "${image}:${tag}"
          docker push "${image}:latest"

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload production configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'docker-compose.prod.yml,scripts/validate-prod-config.sh'
          target: /home/game-platform

      - name: Migrate and roll out services
        uses: appleboy/ssh-action@v1.2.0
        env:
          TCR_LOGIN_SERVER: ${{ secrets.TCR_LOGIN_SERVER }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TCR_LOGIN_SERVER,TCR_USERNAME,TCR_PASSWORD,IMAGE_TAG
          script: |
            set -eu
            cd /home/game-platform
            test -f .env
            set -a
            . ./.env
            set +a
            export GAME_PLATFORM_IMAGE_REGISTRY="${TCR_LOGIN_SERVER}/tengxuntcr"
            export GAME_PLATFORM_IMAGE_TAG="$(printf '%s' "${IMAGE_TAG}" | cut -c1-7)"
            printf '%s' "${TCR_PASSWORD}" | docker login "${TCR_LOGIN_SERVER}" \
              --username "${TCR_USERNAME}" --password-stdin
            docker network inspect global-network >/dev/null
            chmod +x scripts/validate-prod-config.sh
            ./scripts/validate-prod-config.sh
            for attempt in $(seq 1 5); do
              if docker compose -f docker-compose.prod.yml pull \
                schema-migrate control-plane platform-rpc gateway roomhost; then
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "service image pull failed" >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
            docker compose -f docker-compose.prod.yml \
              run --rm --no-deps schema-migrate
            docker compose -f docker-compose.prod.yml \
              up -d --no-deps control-plane platform-rpc
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:18093/readyz >/dev/null; then
                break
              fi
              if [ "${attempt}" -eq 30 ]; then
                echo "platform-rpc readiness check failed" >&2
                exit 1
              fi
              sleep 2
            done
            docker compose -f docker-compose.prod.yml \
              up -d --no-deps --remove-orphans gateway roomhost
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:18000/healthz >/dev/null; then
                break
              fi
              if [ "${attempt}" -eq 30 ]; then
                echo "gateway readiness check failed" >&2
                exit 1
              fi
              sleep 2
            done
            docker image prune -f

      - name: Notify Feishu
        if: success()
        continue-on-error: true
        run: |
          curl --fail-with-body -X POST \
            "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"msg_type":"text","content":{"text":"game-platform deployment succeeded"}}'
