name: Recover Production Services

on:
  workflow_dispatch:
  push:
    tags:
      - recover-game-platform-*

permissions:
  contents: read

concurrency:
  group: game-platform-production-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Upload production configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml,scripts/validate-prod-config.sh
          target: /home/game-platform

      - name: Start and verify production services
        uses: appleboy/ssh-action@v1.2.0
        env:
          TCR_LOGIN_SERVER: ${{ secrets.TCR_LOGIN_SERVER }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          CENTER_IMAGE_TAG: be1b9eec293d03276eb269c2ef7c59a79777f72e
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TCR_LOGIN_SERVER,TCR_USERNAME,TCR_PASSWORD,CENTER_IMAGE_TAG
          command_timeout: 10m
          script: |
            set -eu
            cd /home/game-platform
            test -f .env
            set -a
            . ./.env
            set +a
            registry="${TCR_LOGIN_SERVER}/tengxuntcr"
            export GAME_PLATFORM_IMAGE_REGISTRY="${registry}"
            export GAME_PLATFORM_IMAGE_TAG="${CENTER_IMAGE_TAG}"
            persist_env() {
              key="$1"
              value="$2"
              temporary="$(mktemp .env.XXXXXX)"
              awk -v key="${key}" -v value="${value}" '
                BEGIN { found = 0 }
                index($0, key "=") == 1 {
                  print key "=" value
                  found = 1
                  next
                }
                { print }
                END {
                  if (!found) {
                    print key "=" value
                  }
                }
              ' .env >"${temporary}"
              mv "${temporary}" .env
            }
            persist_env GAME_PLATFORM_IMAGE_REGISTRY "${registry}"
            persist_env GAME_PLATFORM_IMAGE_TAG "${CENTER_IMAGE_TAG}"
            printf '%s' "${TCR_PASSWORD}" | docker login "${TCR_LOGIN_SERVER}" \
              --username "${TCR_USERNAME}" --password-stdin
            chmod +x scripts/validate-prod-config.sh
            ./scripts/validate-prod-config.sh
            docker compose -f docker-compose.prod.yml pull \
              gateway control-plane platform-rpc
            services="
              gateway
              control-plane
              platform-rpc
              roomhost-acquire-a
              roomhost-acquire-b
              roomhost-davinci-a
              roomhost-davinci-b
              roomhost-splendor-a
              roomhost-splendor-b
            "
            docker compose -f docker-compose.prod.yml up -d --no-deps ${services}
            for endpoint in \
              http://127.0.0.1:18093/readyz \
              http://127.0.0.1:18000/healthz; do
              for attempt in $(seq 1 30); do
                curl --fail --silent "${endpoint}" >/dev/null && break
                test "${attempt}" -lt 30
                sleep 2
              done
            done
            docker compose -f docker-compose.prod.yml ps ${services}
