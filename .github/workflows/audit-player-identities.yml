name: Audit Player Identities

on:
  push:
    tags:
      - audit-player-identities-*

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify production backup and reports
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "${key_file}"' EXIT
          printf '%s\n' "${SSH_PRIVATE_KEY}" >"${key_file}"
          chmod 600 "${key_file}"
          ssh \
            -i "${key_file}" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" 'sh -s' <<'REMOTE' | tee production-audit.txt
            set -eu
            for report_dir in \
              /home/game-platform/backups/player-identity-20261024T075547Z \
              /home/game-platform/backups/player-identity-20261024T085157Z; do
              checksum_file="${report_dir}/game-platform-player-identities.dump.sha256"
              printf 'report_dir=%s\n' "${report_dir}"
              if [ -f "${checksum_file}" ]; then
                printf 'backup_sha256='
                awk '{print $1}' "${checksum_file}"
                sha256sum --check "${checksum_file}"
              else
                printf 'backup_sha256=missing\n'
              fi
              for report in "${report_dir}"/*.json; do
                [ -f "${report}" ] || continue
                printf '%s=' "${report##*/}"
                jq -c . "${report}"
              done
              if [ -f "${report_dir}/acceptance-sql.txt" ]; then
                printf 'acceptance_sql:\n'
                cat "${report_dir}/acceptance-sql.txt"
              fi
            done
            printf 'mutation_reports:\n'
            for report in /home/game-platform/backups/player-identity-*/*.json; do
              [ -f "${report}" ] || continue
              if jq -e '
                ((.migratedGames // 0) > 0)
                or (
                  (.dryRun == false)
                  and ((.succeeded // 0) > 0)
                )
              ' "${report}" >/dev/null; then
                printf '%s=' "${report}"
                jq -c . "${report}"
              fi
            done
            cd /home/game-platform
            set -a
            . ./.env
            set +a
            migration_image="$(
              docker images --format '{{.Repository}}:{{.Tag}}' |
                awk '/game-platform-identity-migration/ { print; exit }'
            )"
            test -n "${migration_image}"
            printf 'identity_aliases:\n'
            docker run --rm \
              --network global-network \
              --env POSTGRES_DSN \
              --entrypoint sh \
              "${migration_image}" \
              -c 'psql "$POSTGRES_DSN" -At -v ON_ERROR_STOP=1 \
                -c "SELECT '\''alias_rows='\'' || COUNT(*) FROM player_identity_aliases" \
                -c "SELECT '\''alias_games='\'' || COUNT(DISTINCT game_id) FROM player_identity_aliases"'
          REMOTE
          {
            printf '## Production identity reports\n\n```text\n'
            cat production-audit.txt
            printf '```\n'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Verify public leaderboards
        run: |
          set -euo pipefail
          for game_type in acquire davinci splendor; do
            response="$(
              curl --fail --silent --show-error \
                "https://api.gamebus.online/pam-api/platform/rankings?gameType=${game_type}&limit=5&offset=0&sort=metric"
            )"
            printf '%s\n' "${response}" | jq -e '
              .data.entries
              | all(
                  (.playerID == (.userID | tostring))
                  and (.displayName | type == "string")
                  and (.displayName | length > 0)
                )
            ' >/dev/null
            {
              printf 'leaderboard_%s=' "${game_type}"
              printf '%s\n' "${response}" | jq -c '{
                count: (.data.entries | length),
                entries: [.data.entries[] | {
                  userID,
                  playerID,
                  displayName
                }]
              }'
            } | tee -a leaderboard-audit.txt
          done
          {
            printf '\n## Public leaderboard samples\n\n```text\n'
            cat leaderboard-audit.txt
            printf '```\n'
          } >>"${GITHUB_STEP_SUMMARY}"
