port: 4222
http_port: 8222
debug: true
trace: true

jetstream {
  store_dir: "/data/jetstream"
}

authorization {
  users: [
    {
      user: "control"
      password: $NATS_CONTROL_PASSWORD
      permissions: {
        publish: ["room.control.*", "$JS.API.CONSUMER.>", "$JS.API.STREAM.INFO.GAME_COMMANDS"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: "maintenance"
      password: $NATS_MAINTENANCE_PASSWORD
      permissions: {
        publish: ["$JS.API.STREAM.INFO.GAME_COMMANDS", "$JS.API.STREAM.PURGE.GAME_COMMANDS", "$JS.API.STREAM.MSG.DELETE.GAME_COMMANDS"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: "auth"
      password: $NATS_AUTH_PASSWORD
      permissions: {
        publish: ["pam.auth.email.verification.*", "$JS.API.>", "$JS.ACK.>"]
        subscribe: ["pam.auth.email.verification.*", "_INBOX.>"]
      }
    }
    {
      user: "gateway-1"
      password: $NATS_GATEWAY_1_PASSWORD
      permissions: {
        publish: ["room.cmd.*"]
        subscribe: ["gateway.deliver.gateway-1", "_INBOX.>"]
      }
    }
    {
      user: "gateway-2"
      password: $NATS_GATEWAY_2_PASSWORD
      permissions: {
        publish: ["room.cmd.*"]
        subscribe: ["gateway.deliver.gateway-2", "_INBOX.>"]
      }
    }
    {
      user: "roomhost-1"
      password: $NATS_ROOMHOST_1_PASSWORD
      permissions: {
        publish: ["cmdlog.*", "gateway.deliver.*", "_INBOX.>", "$JS.ACK.>", "$JS.API.CONSUMER.>", "$JS.API.STREAM.INFO.GAME_COMMANDS", "$JS.API.STREAM.MSG.GET.GAME_COMMANDS", "$JS.API.STREAM.CREATE.GAME_COMMANDS", "$JS.API.STREAM.UPDATE.GAME_COMMANDS"]
        subscribe: ["room.cmd.roomhost-1", "room.control.roomhost-1", "_INBOX.>"]
      }
    }
    {
      user: "roomhost-2"
      password: $NATS_ROOMHOST_2_PASSWORD
      permissions: {
        publish: ["cmdlog.*", "gateway.deliver.*", "_INBOX.>", "$JS.ACK.>", "$JS.API.CONSUMER.>", "$JS.API.STREAM.INFO.GAME_COMMANDS", "$JS.API.STREAM.MSG.GET.GAME_COMMANDS", "$JS.API.STREAM.CREATE.GAME_COMMANDS", "$JS.API.STREAM.UPDATE.GAME_COMMANDS"]
        subscribe: ["room.cmd.roomhost-2", "room.control.roomhost-2", "_INBOX.>"]
      }
    }
    {
      user: "gateway-a"
      password: $NATS_GATEWAY_A_PASSWORD
      permissions: {
        publish: ["room.cmd.*"]
        subscribe: ["gateway.deliver.gateway-a", "_INBOX.>"]
      }
    }
    {
      user: "gateway-b"
      password: $NATS_GATEWAY_B_PASSWORD
      permissions: {
        publish: ["room.cmd.*"]
        subscribe: ["gateway.deliver.gateway-b", "_INBOX.>"]
      }
    }
    {
      user: "roomhost-a"
      password: $NATS_ROOMHOST_A_PASSWORD
      permissions: {
        publish: ["cmdlog.*", "gateway.deliver.*", "_INBOX.>", "$JS.ACK.>", "$JS.API.CONSUMER.>", "$JS.API.STREAM.INFO.GAME_COMMANDS", "$JS.API.STREAM.MSG.GET.GAME_COMMANDS", "$JS.API.STREAM.CREATE.GAME_COMMANDS", "$JS.API.STREAM.UPDATE.GAME_COMMANDS"]
        subscribe: ["room.cmd.roomhost-a", "room.control.roomhost-a", "_INBOX.>"]
      }
    }
    {
      user: "roomhost-b"
      password: $NATS_ROOMHOST_B_PASSWORD
      permissions: {
        publish: ["cmdlog.*", "gateway.deliver.*", "_INBOX.>", "$JS.ACK.>", "$JS.API.CONSUMER.>", "$JS.API.STREAM.INFO.GAME_COMMANDS", "$JS.API.STREAM.MSG.GET.GAME_COMMANDS", "$JS.API.STREAM.CREATE.GAME_COMMANDS", "$JS.API.STREAM.UPDATE.GAME_COMMANDS"]
        subscribe: ["room.cmd.roomhost-b", "room.control.roomhost-b", "_INBOX.>"]
      }
    }
  ]
}
