http:
  routers:
    control:
      entryPoints: [web]
      rule: >-
        PathPrefix(`/platform/instances`) ||
        PathPrefix(`/platform/topology`) ||
        PathPrefix(`/platform/events`) ||
        PathPrefix(`/platform/command-log`)
      priority: 110
      service: control
    platform-api:
      entryPoints: [web]
      rule: PathPrefix(`/platform`) || Path(`/.well-known/jwks.json`)
      priority: 100
      service: platform-api
    gateway:
      entryPoints: [web]
      rule: PathPrefix(`/ws`)
      priority: 100
      service: gateway
    admin:
      entryPoints: [web]
      rule: PathPrefix(`/admin`)
      priority: 50
      service: admin
    frontend:
      entryPoints: [web]
      rule: PathPrefix(`/`)
      priority: 1
      service: frontend

  services:
    control:
      loadBalancer:
        servers:
          - url: http://control-plane:8080
    platform-api:
      loadBalancer:
        servers:
          - url: http://platform-api:8080
    gateway:
      loadBalancer:
        servers:
          - url: http://gateway:8080
    admin:
      loadBalancer:
        servers:
          - url: http://admin-console:8080
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:80
