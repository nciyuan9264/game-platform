name: game-platform-b

x-build-args: &build_args
  GOPROXY: https://goproxy.cn,direct
  HTTP_PROXY: http://sys-proxy-rd-relay.byted.org:8118
  HTTPS_PROXY: http://sys-proxy-rd-relay.byted.org:8118
  http_proxy: http://sys-proxy-rd-relay.byted.org:8118
  https_proxy: http://sys-proxy-rd-relay.byted.org:8118

x-common-env: &common_env
  PAM_ENV: test
  PAM_SERVICE_REGISTRY_PREFIX: pam/services
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: "${REDIS_PASSWORD:-local-redis}"
  POSTGRES_DSN: postgres://game:game@postgres:5432/game_platform?sslmode=disable
  ETCD_ENDPOINTS: etcd:2379

services:
  schema-migrate:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        <<: *build_args
        SERVICE: migrate-schema
    environment:
      POSTGRES_DSN: postgres://game:game@postgres:5432/game_platform?sslmode=disable
    networks:
      - game-platform
    restart: "no"

  platform-rpc:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        <<: *build_args
        SERVICE: platform-rpc
    environment:
      <<: *common_env
      GAME_PLATFORM_RPC_ADDR: ":18092"
      GAME_PLATFORM_HEALTH_ADDR: ":18093"
      GAME_PLATFORM_RPC_PSM: game.platform.rpc
      CONTROL_RPC_ADDR: control-plane:18091
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    networks:
      - game-platform
    restart: unless-stopped

  platform-api:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        <<: *build_args
        SERVICE: platform-api
    environment:
      <<: *common_env
      SERVER_ADDR: ":8080"
      AUTH_RPC_ADDR: auth-rpc:19090
      CONTROL_RPC_ADDR: control-plane:18091
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      AUTH_DEV_CODE_RESPONSE: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:18000"
      ACQUIRE_LOADTEST_ENABLED: "${ACQUIRE_LOADTEST_ENABLED:-false}"
      ACQUIRE_LOADTEST_TOKEN: "${ACQUIRE_LOADTEST_TOKEN:-}"
    labels:
      - traefik.enable=true
      - traefik.http.routers.game-platform-api.rule=PathPrefix(`/platform`) || Path(`/.well-known/jwks.json`)
      - traefik.http.routers.game-platform-api.entrypoints=web
      - traefik.http.routers.game-platform-api.priority=100
      - traefik.http.services.game-platform-api.loadbalancer.server.port=8080
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    networks:
      - game-platform
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        <<: *build_args
        SERVICE: gateway
    environment:
      <<: *common_env
      SERVER_ADDR: ":8080"
      NODE_ID: gateway-b
      PUBLIC_ADDR: gateway-b:8080
      AUTH_RPC_ADDR: auth-rpc:19090
      NATS_URL: "nats://gateway-b:${NATS_GATEWAY_B_PASSWORD:-local-gateway-b}@nats:4222"
    labels:
      - traefik.enable=true
      - traefik.http.routers.game-gateway.rule=PathPrefix(`/ws`)
      - traefik.http.routers.game-gateway.entrypoints=web
      - traefik.http.routers.game-gateway.priority=100
      - traefik.http.services.game-gateway.loadbalancer.server.port=8080
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    networks:
      - game-platform
    restart: unless-stopped

  roomhost:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        <<: *build_args
        SERVICE: roomhost
    environment:
      <<: *common_env
      NODE_ID: roomhost-b
      PUBLIC_ADDR: roomhost-b:9000
      NATS_URL: "nats://roomhost-b:${NATS_ROOMHOST_B_PASSWORD:-local-roomhost-b}@nats:4222"
      DAVINCI_AI_THINK_DELAY_MIN_MS: 1500
      DAVINCI_AI_THINK_DELAY_MAX_MS: 2500
    stop_grace_period: 15s
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    networks:
      - game-platform
    restart: unless-stopped

networks:
  game-platform:
    external: true
    name: game-platform
